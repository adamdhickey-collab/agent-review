<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Review</title>
    <meta
      name="description"
      content="Review UI written by coding agents before it ships. A working prototype: a component system, its Storybook, the rules an agent reads, and the review a person makes of what comes back."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* The appearance, before the first paint (src/app/useTheme.ts). Dark
         until a person chooses; a remembered Light or Dark is put on the
         root; System leaves it bare, the operating system's scheme
         (app/global.css). */
      var t = 'dark';
      try {
        t = localStorage.getItem('agent-review:theme') || 'dark';
      } catch (e) {}
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      /* The router puts a reloaded or revisited page back where it was,
         once the screen is there to scroll (src/app/router.ts); the browser
         would try before that, against an empty page. */
      history.scrollRestoration = 'manual';
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400&family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=Inter:opsz,wght@14..32,400..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
