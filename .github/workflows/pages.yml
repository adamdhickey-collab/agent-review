# Builds the product and the Storybook into one artifact and publishes it
# to GitHub Pages: the product at /agent-review/, the Storybook at
# /agent-review/storybook/.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # For the failure notice at the bottom. A red run in a tab nobody has open
  # is not a notification; an issue is.
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever deploy-pages landed: the first try, or the second (below).
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build-storybook
      - run: node scripts/build-check.mjs --dist dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # Twice, because the first look can come too early. deploy-pages asks
      # the artifact store for this run's `github-pages` artifact under a
      # second after the upload finalizes, and the store does not always list
      # it yet ("Found 0 artifact(s)"). On 2026-11-21 that failed #118's
      # deploy and #121's twice in a row; adamhickey.com's pages.yml measured
      # the same race the same day and added this (adamhickey.com#1336).
      #
      # So the first try is allowed to fail, and a failure waits fifteen
      # seconds and tries once more in the same run, on the one artifact
      # already uploaded. Don't "Re-run failed jobs" on a red deploy: a
      # re-run uploads a second artifact into the run and deploy-pages
      # refuses to choose between two. Start a new run instead:
      #
      #   gh workflow run pages.yml --ref main
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: The artifact store may be behind, so wait and deploy again
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning title=deploy-pages took two tries::The first try failed, most likely because the artifact store had not listed the upload yet. Waiting fifteen seconds, then trying again in this run."
          sleep 15
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # LOUDLY, because the quiet version of this failure is a stale
      # prototype that reads as a quiet day, and adamhickey.com embeds it, so
      # the case study shows the old one too. Three places, none of which is
      # the run log: an annotation on the run, a job summary, and an issue,
      # the issue being the only one that arrives anywhere on its own.
      # Carried over from adamhickey.com's pages.yml.
      #
      # One issue per outage, not per attempt: a later failure comments on
      # the open one. Closing it is the signal that the prototype is current
      # again. A cancelled run is not a failure, so two merges landing
      # seconds apart, which cancel the first deploy by design, open nothing.
      - name: Say so somewhere that is not the run log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          SUBJECT: ${{ github.event.head_commit.message }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short="${SHA:0:7}"
          title="The prototype did not deploy"
          # First line only, and pipes escaped: the subject goes in a table
          # cell, and a commit message is allowed to contain both. A run
          # started by hand has no head_commit, so read it from the checkout.
          subject=${SUBJECT%%$'\n'*}
          [ -n "$subject" ] || subject=$(git log -1 --format=%s "$SHA" 2>/dev/null || true)
          subject=${subject//|/\\|}
          echo "::error title=$title::$short is on main and is not on the prototype. The previous deploy is still being served."

          cat > "$RUNNER_TEMP/notice.md" <<EOF
          **\`$short\` is on \`main\` and is not on https://adamdhickey-collab.github.io/agent-review/.**
          Pages is still serving the previous deploy, and so is the prototype
          embedded in adamhickey.com's case study.

          | | |
          | --- | --- |
          | Commit | \`$short\` — $subject |
          | Run | $RUN |

          Read the failing step in that run.

          - **npm ci, the builds, or build-check**: the build is broken on
            \`main\`. Its log names the file; build-check's names the stylesheet
            that lost \`light-dark()\`.
          - **deploy-pages**, finding no artifact named \`github-pages\` or more
            than one: GitHub's artifact store was behind the upload, and stayed
            behind through a second try fifteen seconds later, or this is a
            re-run. Start a new run rather than re-running this one, because a
            re-run adds a second artifact to this run and deploy-pages will not
            choose between them:

            \`\`\`bash
            gh workflow run pages.yml --ref main
            \`\`\`

          - **Anything else**: the usual suspects are the artifact upload and
            Pages itself.

          Nothing is lost while this is open. The commit is on \`main\`, only
          unpublished, and any later push to \`main\` deploys it along with
          whatever fixed this.

          Close this issue once the prototype is current again.
          EOF

          cat "$RUNNER_TEMP/notice.md" >> "$GITHUB_STEP_SUMMARY"

          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                   --search "\"$title\" in:title" \
                   --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/notice.md"
            echo "commented on the open notice, #$open"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title: $short" --body-file "$RUNNER_TEMP/notice.md"
          fi
